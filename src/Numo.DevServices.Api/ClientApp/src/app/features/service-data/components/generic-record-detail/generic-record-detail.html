<dl class="generic-record-detail">
  @for (field of fields(); track $index) {
    <dt class="generic-record-detail__label">{{ field.label }}</dt>

    <dd
      class="generic-record-detail__value"
      [class.generic-record-detail__value--id]="field.kind === 'Guid'"
    >
      @if (field.link) {
        <a [routerLink]="['/service-data', field.link.targetResource, field.link.id]">
          {{ display(field) }}
        </a>
      } @else {
        {{ display(field) }}
      }
    </dd>
  }
</dl>

@if (relations().length) {
  <nav class="generic-record-detail__relations">
    @for (relation of relations(); track relation.label) {
      <a
        class="generic-record-detail__relation"
        [routerLink]="['/service-data', relation.targetResource]"
        [queryParams]="relationQuery(relation)"
      >
        {{ relation.label }}
      </a>
    }
  </nav>
}
