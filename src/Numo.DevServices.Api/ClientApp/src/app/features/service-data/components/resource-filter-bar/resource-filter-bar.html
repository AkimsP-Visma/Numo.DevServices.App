@if (filters().length) {
  <form class="resource-filter-bar" (ngSubmit)="apply()">
    @for (filter of filters(); track filter.key) {
      <div class="resource-filter-bar__field">
        <label class="resource-filter-bar__label" [attr.for]="'filter-' + filter.key">
          {{ filter.label }}
        </label>

        @switch (filter.kind) {
          @case ('Boolean') {
            <p-select
              [inputId]="'filter-' + filter.key"
              [options]="[...booleanOptions]"
              optionLabel="label"
              optionValue="value"
              [ngModel]="valueOf(filter.key)"
              [ngModelOptions]="{ standalone: true }"
              (ngModelChange)="setValue(filter.key, $event)"
            />
          }
          @case ('Enum') {
            <p-select
              [inputId]="'filter-' + filter.key"
              [options]="[...enumOptions(filter)]"
              optionLabel="label"
              optionValue="value"
              [ngModel]="valueOf(filter.key)"
              [ngModelOptions]="{ standalone: true }"
              (ngModelChange)="setValue(filter.key, $event)"
            />
          }
          @case ('Date') {
            <p-datepicker
              [inputId]="'filter-' + filter.key"
              dateFormat="yy-mm-dd"
              [showButtonBar]="true"
              [ngModel]="dateValueOf(filter.key)"
              [ngModelOptions]="{ standalone: true }"
              (ngModelChange)="setDateValue(filter.key, $event)"
            />
          }
          @case ('GuidList') {
            <input
              pInputText
              type="text"
              class="resource-filter-bar__wide"
              [attr.id]="'filter-' + filter.key"
              placeholder="up to 4 ids, comma separated"
              spellcheck="false"
              [value]="valueOf(filter.key)"
              (change)="setValue(filter.key, $any($event.target).value)"
            />
          }
          @default {
            <input
              pInputText
              type="text"
              [attr.id]="'filter-' + filter.key"
              spellcheck="false"
              [value]="valueOf(filter.key)"
              (change)="setValue(filter.key, $any($event.target).value)"
            />
          }
        }
      </div>
    }

    <div class="resource-filter-bar__actions">
      <p-button type="submit" label="Apply" />
      <p-button
        type="button"
        label="Clear"
        severity="secondary"
        [text]="true"
        (onClick)="clear()"
      />
    </div>
  </form>
}
