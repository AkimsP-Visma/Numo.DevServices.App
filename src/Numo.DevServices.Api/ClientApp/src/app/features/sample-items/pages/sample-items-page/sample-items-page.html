<div class="sample-items-page">
  <div class="sample-items-page__header">
    <h1 class="sample-items-page__title">Sample items</h1>

    <div class="sample-items-page__actions">
      <p-button label="Reload" severity="secondary" [disabled]="isLoading()" (onClick)="load()" />
      <p-button label="New item" (onClick)="openCreateDialog()" />
    </div>
  </div>

  @if (errorMessage(); as message) {
    <p-message severity="error" [text]="message" />
  }

  <p-table [value]="items()" [loading]="isLoading()" dataKey="id" styleClass="p-datatable-sm">
    <ng-template #header>
      <tr>
        <th>Name</th>
        <th>Description</th>
      </tr>
    </ng-template>

    <ng-template #body let-item>
      <tr>
        <td>{{ item.name }}</td>
        <td>{{ item.description || '-' }}</td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="2">No sample items yet.</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog
  header="New sample item"
  [visible]="isDialogOpen()"
  (visibleChange)="isDialogOpen.set($event)"
  [modal]="true"
  [style]="{ width: '32rem' }"
>
  <form [formGroup]="createForm" class="sample-items-form" (ngSubmit)="create()">
    <label class="sample-items-form__field">
      <span>Name</span>
      <input pInputText formControlName="name" [maxlength]="nameMaxLength" autocomplete="off" />
    </label>

    <label class="sample-items-form__field">
      <span>Description</span>
      <textarea pTextarea formControlName="description" [maxlength]="descriptionMaxLength" rows="3"></textarea>
    </label>
  </form>

  <ng-template #footer>
    <p-button label="Cancel" severity="secondary" [disabled]="isSaving()" (onClick)="isDialogOpen.set(false)" />
    <p-button label="Create" [loading]="isSaving()" (onClick)="create()" />
  </ng-template>
</p-dialog>
