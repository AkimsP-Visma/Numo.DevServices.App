<div
  class="app-layout"
  [class.app-layout--testing]="environmentStore.current() === 'Testing'"
  [class.app-layout--staging]="environmentStore.current() === 'Staging'"
  [class.app-layout--production]="environmentStore.current() === 'Production'"
>
  <header class="app-layout__header">
    <span class="app-layout__title">Numo Dev Services</span>

    @if (environmentStore.known().length) {
      <p-select
        class="app-layout__environment"
        [options]="[...environmentStore.known()]"
        [ngModel]="environmentStore.current()"
        [ngModelOptions]="{ standalone: true }"
        (ngModelChange)="environmentStore.switchTo($event)"
      />
    }
  </header>

  <div class="app-layout__body">
    <nav class="app-layout__nav">
      @for (item of navigationItems; track item.label) {
        <a
          [routerLink]="item.route"
          [queryParams]="item.queryParams ?? null"
          [routerLinkActiveOptions]="{ exact: true, matrixParams: 'ignored', queryParams: item.queryParams ? 'exact' : 'ignored', fragment: 'ignored' }"
          routerLinkActive="app-layout__nav-link--active"
          class="app-layout__nav-link"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <main class="app-layout__content">
      <router-outlet />
    </main>
  </div>
</div>
